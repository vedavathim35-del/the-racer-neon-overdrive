 r.ot=Math.max(0,(r.ot||0)-dt);
 for(const o of racers.concat([P],traffic,OBS)){if(o===r)continue;const d=dS(o.prog,r.prog),oo=o.isP?P.lat:o.off;if(d>0&&d<30&&Math.abs(oo-r.off)<3.2){if(r.ot<=0){r.os=r.off>=oo?1:-1;if(Math.abs(r.off+r.os*4)>L.w/2-3)r.os=-r.os;r.ot=1.8;}
  if(o.isOb){if(d<10&&Math.abs(oo-r.off)<1.8)tv=Math.min(tv,14);}else{if(d<9)tv=Math.min(tv,(o.spd||0)*.98+1);else if(d>12)tv*=1.03;}}}
 if(r.ot>0)to=r.off+r.os*4;
 r.to=clamp(to,-L.w/2+3,L.w/2-3);r.spd+=clamp(tv-r.spd,-38*dt,(18+r.skill*8)*dt);r.off+=clamp(r.to-r.off,-3.2*dt,3.2*dt);r.prog+=r.spd*dt;
 if(!r.fin&&r.prog>=L.laps*TR.L){r.fin=true;r.ft=raceT;}}
function trf(t,dt){if(state==='cd'||state==='menu'||state==='pause')return;t.spd+=Math.min(t.base-t.spd,6*dt);t.prog+=t.spd*dt;}
/* ---- main race step ---- */
function step(dt){const L=LV[lvl];
 if(state==='cd'){cdT-=dt;const n=Math.ceil(cdT);if(n!==lastCd&&n>0){lastCd=n;$('msg').textContent=n;sfx.cd();}if(cdT<=0){state='race';raceT=0;$('msg').textContent='GO!';sfx.go();msgT=1;}}
 else if(state==='race'||state==='res'){if(state==='race')raceT+=dt;}
 drive(dt);wall();carHits(dt);racers.forEach(r=>ai(r,dt));traffic.forEach(t=>trf(t,dt));placeAll();
 if(state==='race'&&!P.fin){const ncp=L.laps*4,cl=TR.L/4;while(P.cp<ncp&&P.prog>=(P.cp+1)*cl){P.cp++;if(cpMats[P.cp%4])cpMats[P.cp%4].color.setHex(0x00ff66);
   if(P.cp%4===0&&P.cp<ncp){cpMats.forEach((m,q)=>m.color.setHex(q?0xffdd00:0xffffff));sfx.lap();msgS('LAP '+(P.cp/4)+' DONE  '+fmt(raceT));}else if(P.cp<ncp){msgS('CHECKPOINT '+P.cp+'/'+ncp+'  '+fmt(raceT));sfx.cp();}
   if(P.cp<ncp)flashFx('0,255,120');}
  if(P.cp>=ncp)finish();else if(raceT>=LIM[lvl])finish(true);}
 if(msgT>0){msgT-=dt;if(msgT<=0)$('msg').textContent='';}
 smoke.forEach(s=>{if(s.life>0){s.life-=dt;s.position.y+=dt*1.5;s.scale.multiplyScalar(1+dt*1.2);s.material.opacity=Math.max(0,s.life);if(s.life<=0)s.visible=false;}});
 if(P.nit<99&&P.boost&&!P.nsnd){P.nsnd=1;sfx.nit();}if(!P.boost)P.nsnd=0;}
function msgS(t){$('msg').textContent=t;msgT=1.4;}
const rankOf=()=>1+racers.filter(r=>r.fin||(!P.fin&&r.prog>P.prog)).length;
function finish(tu){P.fin=true;P.ft=raceT;const L=LV[lvl],rank=tu?racers.length+1:1+racers.filter(r=>r.fin).length,ok=!tu&&rank<=(L.top||3)&&P.drift>=L.need;state='res';S.adapt=clamp((S.adapt||0)+(!tu&&rank<=1?.02:(tu||rank>=4)?-.02:0),-.06,.06);
 const cr=Math.max(0,(7-rank)*100)+Math.floor(P.drift/10);let nb='';
 if(ok){S.credits+=cr;if(!S.best[lvl]||P.ft<S.best[lvl]){S.best[lvl]=P.ft;nb=' (NEW BEST!)';}if(lvl+2>S.unl&&lvl<4){S.unl=lvl+2;nb+='\nLevel '+(lvl+2)+' unlocked!';}save();sfx.win();}else sfx.lose();
 $('rt').textContent=ok?'RACE COMPLETE':tu?'TIME UP — YOU LOSE':'OBJECTIVE FAILED';
 $('rb').textContent=`Position : ${tu?'DNF':rank} / ${racers.length+1}\nTime     : ${fmt(P.ft)}${nb}\nBest     : ${fmt(S.best[lvl])}\nDrift    : ${Math.floor(P.drift)}${L.need?' (need '+L.need+')':''}\nCredits  : +${ok?cr:0} (total ${S.credits})\n`+(ok?'':'Need '+(L.need&&P.drift<L.need&&rank<=(L.top||3)?'more drift score':'top '+(L.top||3)));
 $('nx').disabled=!(ok&&lvl<4);$('hud').classList.remove('on');show('res');}
/* ---- camera ---- */
function camUpd(dt){const p=P,sp=p.spd,fx=Math.sin(p.h),fz=Math.cos(p.h),back=K.KeyC?-1:1;let fov=65+sp*.22+(p.boost?10:0);
 if(state==='menu'){const a=performance.now()/2500;cam.position.set(p.x+Math.sin(a)*9,3.2,p.z+Math.cos(a)*9);cam.lookAt(p.x,1,p.z);fov=55;}
 else if(p.hc===1){cam.position.set(p.x+fx*.4,1.2,p.z+fz*.4);cam.lookAt(p.x+fx*30*back,1.1,p.z+fz*30*back);}
 else{const d=8+sp*.07,tx=p.x-fx*d*back,tz=p.z-fz*d*back,t=1-Math.exp(-(state==='res'?2:7)*dt);cam.position.x+=(tx-cam.position.x)*t;cam.position.z+=(tz-cam.position.z)*t;cam.position.y+=(3.1+sp*.012-cam.position.y)*t;cam.lookAt(p.x+fx*7*back,1.3,p.z+fz*7*back);}
 if(shake>0){cam.position.x+=rnd(-1,1)*shake*.5;cam.position.y+=rnd(-1,1)*shake*.3;shake=Math.max(0,shake-dt*3);}
 cam.fov+=(fov-cam.fov)*.1;cam.updateProjectionMatrix();
 $('fx').style.background=P.boost?'radial-gradient(transparent 55%,rgba(0,200,255,.25))':sp>45?`radial-gradient(transparent 60%,rgba(255,255,255,${Math.min(.18,(sp-45)/100)}))`:'none';}
/* ---- HUD / audio update ---- */
function hud(){const c=CARS[S.car],kmh=P.spd*3.6,vF=P.vF||0,band=c.max/6,g=vF<-1?'R':kmh<2?'N':1+Math.min(5,Math.floor(P.spd/band)),rpm=g==='N'||g==='R'?.2+(inp().thr?.6:0):.3+.65*((P.spd%band)/band);
 $('sp').textContent=Math.round(kmh);$('gr').textContent=g;$('rpm').style.width=Math.round(rpm*100)+'%';$('nit').style.width=Math.round(P.nit)+'%';
 const L=LV[lvl];$('pos').textContent=rankOf()+'/'+(racers.length+1);$('lap').textContent='LAP '+clamp(Math.floor(P.prog/TR.L)+1,1,L.laps)+'/'+L.laps;$('cpt').textContent='CP '+P.cp+'/'+L.laps*4;$('cr').textContent='TIME LEFT '+fmt(Math.max(0,LIM[lvl]-raceT))+' · '+(NAME[curK]||'')+(wet>.15?' · RAIN '+Math.round(wet*100)+'%':'');$('gi').style.display=state==='cd'?'block':'none';
 $('tm').textContent=fmt(raceT);$('dr').textContent=P.drift>0?'DRIFT '+Math.floor(P.drift)+(L.need?' / '+L.need:''):'';
 if(tipT>0&&state!=='pause'){tipT-=.016;$('tip').style.display='block';$('tip').textContent=['W accelerate · S brake/reverse','A/D steer · SPACE handbrake drift','SHIFT nitro · R reset · E camera · C look back'][Math.min(2,Math.floor((16-tipT)/5.4))];}else $('tip').style.display='none';
 const m=ctx2;m.clearRect(0,0,150,150);m.lineWidth=5;m.strokeStyle='#335';m.stroke(mmPath);m.lineWidth=1.5;m.strokeStyle='#0ff';m.stroke(mmPath);
 const dot=(o,col,r)=>{m.fillStyle=col;m.beginPath();m.arc((o.x-mmB.x0)*mmB.sc+12,(o.z-mmB.z0)*mmB.sc+12,r,0,7);m.fill();};racers.forEach(r=>dot(r,'#f35',3));dot(P,'#fff',4.5);
 const I=inp(),tg=(id,on)=>$(id).classList.toggle('on',!!on);tg('kU',I.thr);tg('kD',I.br);tg('kL',I.l);tg('kR',I.r);tg('kS',I.hb);tg('kN',I.nit);$('wl').style.transform='rotate('+(-P.st*80)+'deg)';$('g2').textContent=g;drawGauge(kmh);navUpd();}
const gg=$('gg').getContext('2d');
function drawGauge(k){const m=gg,mx=CARS[S.car].max*3.6*1.25,f=clamp(k/mx,0,1),a0=Math.PI*.8,a1=Math.PI*2.2;m.clearRect(0,0,170,110);m.lineWidth=10;m.lineCap='round';m.strokeStyle='#223';m.beginPath();m.arc(85,62,50,a0,a1);m.stroke();m.strokeStyle=f>.8?'#f23':f>.55?'#fb0':'#0ff';m.beginPath();m.arc(85,62,50,a0,a0+(a1-a0)*f+.001);m.stroke();m.fillStyle='#fff';m.font='bold 28px Courier New';m.textAlign='center';m.fillText(Math.round(k),85,70);m.font='10px Courier New';m.fillStyle='#89a';m.fillText('KM/H · SPEED',85,86);}
/* ---- race directions: arrow to next gate, distance, upcoming turn, wrong-way warning ---- */
let wwT=0;
function navUpd(){const L=LV[lvl],on=state==='race';$('nav').style.display=on?'block':'none';if(!on){$('wr').style.display='none';return;}
 const n=TR.N,i=P.idx,tp=posAt(wrapS(P.prog+45),0);let rel=Math.atan2(tp.cx-P.x,tp.cz-P.z)-P.h;while(rel>Math.PI)rel-=2*Math.PI;while(rel<-Math.PI)rel+=2*Math.PI;
 $('na').style.transform='rotate('+(-rel*57.3)+'deg)';
 const ncp=L.laps*4,nx=Math.min(P.cp+1,ncp),d=Math.max(0,nx*TR.L/4-P.prog),a0=Math.atan2(TR.T[i].x,TR.T[i].z);let tx='STRAIGHT AHEAD';
 for(let k=6;k<=45;k+=3){const j=(i+k)%n;let q=Math.atan2(TR.T[j].x,TR.T[j].z)-a0;if(q>Math.PI)q-=2*Math.PI;if(q<-Math.PI)q+=2*Math.PI;if(Math.abs(q)>.4){tx=(q>0?'◀ LEFT':'RIGHT ▶')+(Math.abs(q)>1.1?' HAIRPIN':' TURN')+' IN '+Math.round(k*TR.step)+' m'+(Math.abs(q)>1.1&&P.spd>30?' — BRAKE!':'');break;}}
 $('nt').textContent=(nx>=ncp?'FINISH LINE ':'CHECKPOINT '+nx+'/'+ncp+' ')+Math.round(d)+' m';$('nc').textContent=tx;
 const tg=TR.T[i],ww=P.vx*tg.x+P.vz*tg.z<-4;$('wr').style.display=ww?'block':'none';if(ww){wwT-=.016;if(wwT<=0){wwT=1;sfx.wrong();}}}
function audio(){if(!AC)return;MG.gain.value=S.mute?0:S.vol;const on=state==='race'||state==='cd'||state==='res',c=CARS[S.car],band=c.max/6;
 eng.frequency.value=50+(on?((P.spd%band)/band*90+P.spd*1.2):0);engG.gain.value=on?.07+(inp().thr?.05:0):.0;nzG.gain.value=(on?clamp(Math.abs(P.vR||0)/12,0,.5)*(P.spd>8?1:0)*.5:0)+(on?wet*.05:0);}
/* ---- UI screens ---- */
function scr(id,h){const d=document.createElement('div');d.className='scr';d.id=id;d.innerHTML=h;$('ui').appendChild(d);}
function show(id){document.querySelectorAll('.scr').forEach(d=>d.classList.toggle('on',d.id===id));if(id==='levels')rLevels();if(id==='garage')rGarage();if(id==='settings')rSettings();}
scr('menu','<h1>THE RACER<span>OWN THE NIGHT — NEON OVERDRIVE</span></h1><button data-a="play">PLAY (ENTER)</button><button data-a="levels">LEVEL SELECT</button><button data-a="garage">GARAGE</button><button data-a="settings">SETTINGS</button><button data-a="how">HOW TO PLAY</button><button data-a="ctrl">CONTROLS</button><button data-a="cred">CREDITS</button><small>Gameathon 8.0</small>');
scr('levels','<h2>SELECT LEVEL</h2><div class="row" id="lv"></div><button data-a="unlock">UNLOCK ALL LEVELS</button><button data-a="menu">BACK</button>');
scr('garage','<h2>GARAGE</h2><div class="row" id="gc"></div><pre id="gs"></pre><div class="row" id="gk"></div><button data-a="menu">BACK</button>');
scr('settings','<h2>SETTINGS</h2><div class="row"><label>VOLUME <input id="vol" type="range" min="0" max="1" step=".05"></label><button data-a="mute" id="mu"></button><button data-a="q" id="qq"></button></div><pre>W/↑ accelerate · S/↓ brake/reverse · A/D steer · SPACE handbrake/drift\nSHIFT nitro · E camera · C look back · R reset · ESC pause · ENTER start</pre><button data-a="sback">BACK</button>');
scr('ctrl','<h2>CONTROLS</h2><pre>W / ↑      Accelerate\nS / ↓      Brake · reverse when stopped\nA,D / ←,→  Steer\nSPACE      Handbrake / drift\nLEFT SHIFT Nitro boost\nE          Change camera (chase / hood)\nC          Look behind\nR          Reset onto the road\nESC        Pause · ENTER start/restart\n\nFinish in the top 3 (1st in Level 5) to unlock the next level.\nLevel 4 also needs a drift score of 800.</pre><button data-a="menu">BACK</button>');
scr('cred','<h2>CREDITS</h2><pre>THE RACER: OWN THE NIGHT — NEON OVERDRIVE\nGameathon 8.0 prototype · Three.js r128 · procedural art & audio</pre><button data-a="menu">BACK</button>');
scr('how','<h2>HOW TO PLAY</h2><pre>1. Press PLAY (or pick a level): the 3-2-1-GO countdown starts.\n2. Hold W / ↑ to accelerate. Watch SPEED and GEAR on the dash.\n3. Steer with A / D (◀ ▶). Brake with S / ↓ ▼; hold it when stopped to REVERSE.\n4. Hold SPACE in a corner to DRIFT and earn drift score.\n5. Hold SHIFT on straights for NITRO (blue bar).\n6. Follow the green road arrows and the top arrow to the next yellow gate (turns green when passed).\n    TURN signs warn you early; WRONG WAY means turn around. Finish before TIME LEFT hits 0.\n7. Finish all laps in the TOP 3 (1st on Level 5) to unlock the next level.\n8. R = reset to road · E = camera · C = look back · ESC = pause.\n\nThe key symbols at bottom-left light up as you press them.</pre><button data-a="menu">BACK</button>');
scr('pause','<h2>PAUSED</h2><button data-a="resume">RESUME</button><button data-a="restart">RESTART RACE</button><button data-a="settings">SETTINGS</button><button data-a="menu2">MAIN MENU</button>');
scr('res','<h2 id="rt"></h2><pre id="rb"></pre><button data-a="restart">RETRY</button><button data-a="next" id="nx">NEXT LEVEL</button><button data-a="menu2">MAIN MENU</button>');
function rLevels(){$('lv').innerHTML=LV.map((l,i)=>`<button data-a="lv" data-v="${i}" ${i>=S.unl?'disabled':''}>${i+1}. ${l.n}<br><small>${i>=S.unl?'LOCKED':'Best '+fmt(S.best[i])}</small><br><small>${LV[i].obj}</small></button>`).join('');}
function rGarage(){$('gc').innerHTML=CARS.map((c,i)=>`<button data-a="car" data-v="${i}" class="${i===S.car?'sel':''}">${c.n}</button>`).join('');const c=CARS[S.car],b=v=>'█'.repeat(Math.round(v))+'░'.repeat(10-Math.round(v));
 $('gs').textContent=`${c.n} — ${c.d}\nSPEED ${b(c.max/7)}\nACCEL ${b(c.acc/3.2)}\nGRIP  ${b(c.grip)}\nSTEER ${b(c.steer*4.5)}`;$('gk').innerHTML=CCOL.map((c,i)=>`<button class="sw ${i===S.col?'sel':''}" data-a="col" data-v="${i}" style="background:#${c.toString(16).padStart(6,'0')}"></button>`).join('');}
function rSettings(){$('vol').value=S.vol;$('mu').textContent='SOUND: '+(S.mute?'OFF':'ON');$('qq').textContent='GRAPHICS: '+S.q.toUpperCase();}
function swapCar(){if(!P)return;RG.remove(P.car.g);const old=P.car;P.car=mkCar(CCOL[S.col],S.car);const hl=new THREE.SpotLight(0xfff4dd,1.4,140,.5,.5);hl.position.set(0,1,2);hl.target.position.set(0,0,30);P.car.g.add(hl,hl.target);RG.add(P.car.g);placeAll();}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;aInit();sfx.ui();const a=b.dataset.a,v=+b.dataset.v;
 if(a==='play'||a==='restart')startRace();else if(a==='next'){loadLevel(lvl+1);startRace();}
 else if(a==='unlock'){S.unl=5;save();rLevels();}
 else if(a==='lv'){loadLevel(v);startRace();}
 else if(a==='resume'){state=prev;show(null);}
 else if(a==='sback'){show(state==='pause'?'pause':'menu');}
 else if(a==='menu'||a==='menu2'){state='menu';$('hud').classList.remove('on');loadLevel(lvl);show('menu');}
 else if(a==='car'){S.car=v;save();swapCar();rGarage();}else if(a==='col'){S.col=v;save();swapCar();rGarage();}
 else if(a==='mute'){S.mute=!S.mute;save();rSettings();}else if(a==='q'){S.q=S.q==='low'?'high':'low';R3.setPixelRatio(S.q==='low'?.75:Math.min(devicePixelRatio,2));save();rSettings();}
 else show(a==='ctrl'?'ctrl':a==='cred'?'cred':a);});
$('vol').addEventListener('input',e=>{S.vol=+e.target.value;save();});
/* ---- main loop ---- */
let last=performance.now();
function frame(t){requestAnimationFrame(frame);const dt=Math.min(.05,(t-last)/1000)||.016;last=t;
 try{if(state==='cd'||state==='race'||state==='res')step(dt);envUpd(state==='pause'?0:dt);if(state!=='pause'||true)camUpd(state==='pause'?0:dt);if(state!=='menu')hud();updLamps();audio();R3.render(scene,cam);}catch(e){console.error(e);}}
loadLevel(0);if(!S.seen){S.seen=1;save();show('how');}else show('menu');requestAnimationFrame(frame);
</script></body></html>
